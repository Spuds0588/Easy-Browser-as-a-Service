# Deploy: fly launch --copy-config --no-deploy && fly deploy
# The service listens on 8080 and needs WebSockets enabled (http_service below).
app = "easy-browser-as-a-service"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Access tokens expire an hour after they are minted.
  RBAS_TOKEN_TTL_MS = "3600000"
  # Set the signing key as a secret, never in this file:
  #   fly secrets set RBAS_KEY=$(openssl rand -base64 32)
  # For pages with no backend, allow-list who may mint for themselves. Prefer
  # fly secrets; RBAS_TRUSTED_NETWORKS needs the private network CIDR.
  #   fly secrets set RBAS_TRUSTED_ORIGINS=https://app.example.com
  #   fly secrets set RBAS_TRUSTED_NETWORKS=10.0.0.0/8
  # Resource policy. One concurrent session per address by default; set to 0 for
  # unlimited, or raise it for shared/office IPs. RBAS_SESSION_RATE bounds how
  # fast one address can create new sessions ("20/min"; 0 disables).
  RBAS_MAX_SESSIONS_PER_IP = "1"
  RBAS_SESSION_RATE = "20/min"
  # What the remote browser may load: empty or "*" is open. To lock an install to
  # one app or an enterprise domain, set e.g. RBAS_ALLOWED_DOMAINS="app.example.com"
  # (a bare domain also covers its subdomains). Prefer fly secrets for this.
  #   fly secrets set RBAS_ALLOWED_DOMAINS=app.example.com,*.corp.internal
  # 2GB of RAM must host one Chrome plus every incognito context in it.
  MAX_SESSIONS = "4"
  # Aggressive reaping keeps serverless containers cheap.
  IDLE_TIMEOUT_MS = "300000"
  HIDDEN_TIMEOUT_MS = "120000"
  RECONNECT_GRACE_MS = "60000"
  SCREENCAST_MAX_WIDTH = "1280"
  SCREENCAST_MAX_HEIGHT = "800"
  SCREENCAST_QUALITY = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
