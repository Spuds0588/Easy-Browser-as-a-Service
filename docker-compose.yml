services:
  browser-as-a-service:
    build: .
    image: easy-browser-as-a-service:latest
    container_name: easy-browser-as-a-service
    restart: unless-stopped
    # Host port is configurable: PORT=9000 docker compose up -d --build
    ports:
      - "${PORT:-8080}:8080"
    # Chromium is memory hungry; the shared memory mount avoids renderer crashes.
    shm_size: "1gb"
    # Lets an embedded session reach a service running on the Docker host
    # (e.g. src="http://host.docker.internal:3000") during local development.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      # Token signing key. Set it on the host (RBAS_KEY=… docker compose up -d)
      # for stable tokens; if empty the service generates one at boot.
      RBAS_KEY: "${RBAS_KEY:-}"
      RBAS_TOKEN_TTL_MS: "3600000"
      # No-backend pages: allow-list who may mint for themselves. Leave both
      # empty and the master key is the only way in.
      RBAS_TRUSTED_ORIGINS: "${RBAS_TRUSTED_ORIGINS:-}"
      RBAS_TRUSTED_NETWORKS: "${RBAS_TRUSTED_NETWORKS:-}"
      # Set to the number of trusted proxy hops when running behind one, or the
      # network allow-list above sees the proxy's address instead of the client's.
      RBAS_TRUST_PROXY: "${RBAS_TRUST_PROXY:-0}"
      # Resource policy. Max concurrent sessions from one address (0 = unlimited;
      # default 1 — one embedded app per user). New sessions per address, per
      # window (0 disables). And what the remote browser may load at all: an
      # empty or "*" value is open; otherwise a comma list of domains, where a
      # bare domain also matches its subdomains (app.example.com, *.corp.internal).
      RBAS_MAX_SESSIONS_PER_IP: "${RBAS_MAX_SESSIONS_PER_IP:-1}"
      RBAS_SESSION_RATE: "${RBAS_SESSION_RATE:-20/min}"
      RBAS_ALLOWED_DOMAINS: "${RBAS_ALLOWED_DOMAINS:-}"
      MAX_SESSIONS: "8"
      IDLE_TIMEOUT_MS: "600000"
      HIDDEN_TIMEOUT_MS: "180000"
      RECONNECT_GRACE_MS: "60000"
      SCREENCAST_MAX_WIDTH: "1280"
      SCREENCAST_MAX_HEIGHT: "800"
      SCREENCAST_QUALITY: "70"
