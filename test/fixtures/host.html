<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Host CRM (embedding app)</title>
    <style>
      html, body { margin: 0; background: #1b2432; color: #e6ecf5; font: 14px system-ui, sans-serif; }
      remote-browser { display: block; width: 1024px; height: 700px; }
    </style>
  </head>
  <body>
    <script src="{{SERVICE_ORIGIN}}/sdk.js?token={{RBAS_TOKEN}}"></script>
    <remote-browser id="rb" src="{{TARGET_ORIGIN}}/target.html" server="{{SERVICE_ORIGIN}}"></remote-browser>
    <script>
      // Test-only hooks: the harness reads these from the host page.
      // ?src= and ?key= let one harness drive several independent sessions.
      const params = new URLSearchParams(location.search);
      const element = document.getElementById('rb');
      if (params.get('key')) element.setAttribute('storage-key', params.get('key'));
      if (params.get('src')) element.setAttribute('src', params.get('src'));
      window.__rb = element;
      window.__rbEvents = [];
      ['ready', 'navigate', 'download', 'clipboard'].forEach((type) => {
        element.addEventListener(type, (event) => window.__rbEvents.push({ type, detail: event.detail }));
      });
    </script>
  </body>
</html>
