<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RBAS Target</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #f4f6fb; color: #10151f; }
      button, input { font: inherit; border: 1px solid #b9c2d4; border-radius: 6px; background: #fff; }
      button { cursor: pointer; }
      #increment { position: absolute; left: 20px; top: 20px; width: 180px; height: 50px; }
      #field { position: absolute; left: 20px; top: 90px; width: 400px; height: 40px; padding: 0 8px; }
      #file { position: absolute; left: 20px; top: 150px; width: 220px; height: 40px; }
      #copy { position: absolute; left: 20px; top: 210px; width: 180px; height: 40px; }
      #dl { position: absolute; left: 20px; top: 270px; font-size: 16px; }
      #log { position: absolute; left: 20px; top: 330px; width: 640px; white-space: pre-line; font-family: ui-monospace, monospace; }
      #zone { position: absolute; right: 0; bottom: 0; width: 100%; height: 300px; }
    </style>
  </head>
  <body>
    <button id="increment">increment</button>
    <input id="field" placeholder="type here" autocomplete="off" />
    <input id="file" type="file" />
    <button id="copy">copy text</button>
    <a id="dl" href="/hello.txt" download="hello.txt">download hello.txt</a>
    <div id="log"></div>
    <div id="zone" aria-hidden="true"></div>
    <script>
      const LS = window.localStorage;

      // Each tenant gets its own cookie name, storage values and palette, so a
      // leaked cookie/storage value or a crossed screencast frame is visible.
      const TENANT = (new URLSearchParams(location.search).get('tenant') || 'A').toUpperCase();
      const PALETTE = {
        A: { bg: '#f4f6fb', fg: '#10151f' },
        B: { bg: '#0f2540', fg: '#e6ecf5' },
        C: { bg: '#2b1a3d', fg: '#f2e9ff' },
      };
      const theme = PALETTE[TENANT] || PALETTE.A;
      document.documentElement.style.background = theme.bg;
      document.body.style.background = theme.bg;
      document.body.style.color = theme.fg;
      LS.setItem('tenant', TENANT);
      LS.setItem('secret', TENANT + '-ONLY');
      document.cookie = 'rbas_' + TENANT.toLowerCase() + '=1; path=/';

      const set = (k, v) => { LS.setItem(k, String(v)); render(); };
      const bump = (k) => set(k, parseInt(LS.getItem(k) || '0', 10) + 1);

      function render() {
        document.getElementById('log').textContent = [
          'tenant=' + TENANT + ' secret=' + (LS.getItem('secret') || ''),
          'counter=' + (LS.getItem('counter') || 0),
          'clicks=' + (LS.getItem('clicks') || 0),
          'typed=' + (LS.getItem('typed') || ''),
          'upload=' + (LS.getItem('upload') || ''),
          'copied=' + (LS.getItem('copied') || '0'),
          'cookie=' + document.cookie,
        ].join('\n');
      }

      if (!LS.getItem('booted')) set('booted', Date.now());
      bump('clicks');

      document.getElementById('increment').addEventListener('click', (e) => { e.stopPropagation(); bump('counter'); });
      document.getElementById('copy').addEventListener('click', (e) => {
        e.stopPropagation();
        const area = document.createElement('textarea');
        area.value = 'remote-clipboard-payload';
        document.body.appendChild(area);
        area.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
        area.remove();
        set('copied', ok ? '1' : '0');
      });

      const field = document.getElementById('field');
      field.addEventListener('input', () => set('typed', field.value));
      field.addEventListener('keydown', (e) => { if (e.key === 'Enter') set('enter', '1'); });
      field.focus();

      document.getElementById('file').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        console.log('[TARGET] file change fired files=' + (e.target.files ? e.target.files.length : 'none'));
        if (file) set('upload', file.name + ':' + file.size);
      });

      document.getElementById('dl').addEventListener('click', () => console.log('[TARGET] download link clicked'));

      // Any click in the lower zone bumps a counter, so input passthrough can be
      // asserted without knowing the remote layout.
      document.getElementById('zone').addEventListener('click', () => bump('counter'));

      render();
      window.__RBAS_TARGET_READY = true;
    </script>
  </body>
</html>
